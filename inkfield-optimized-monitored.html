<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Fluid Symbol Simulation with Tweakpane</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #07080b;
      font-family: 'Courier New', Courier, monospace;
      color: #d9e7ff;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }
    #perfHud {
      position: fixed;
      left: 16px;
      bottom: 16px;
      z-index: 20;
      min-width: 280px;
      padding: 12px 14px;
      border: 1px solid rgba(120, 170, 255, 0.2);
      border-radius: 12px;
      background: rgba(7, 8, 11, 0.76);
      backdrop-filter: blur(10px);
      box-shadow: 0 10px 30px rgba(0,0,0,0.25);
      font: 12px/1.45 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      pointer-events: none;
      white-space: pre-line;
    }
  </style>
</head>
<body>
  <canvas id="fluidCanvas"></canvas>
  <div id="perfHud" aria-live="polite">Preparing benchmark…</div>

  <script type="module">
    const canvas = document.getElementById('fluidCanvas');
    const ctx = canvas.getContext('2d', { alpha: false, desynchronized: true });
    const perfHud = document.getElementById('perfHud');

    // ponytail: pinned to 1 so the A/B against the baseline compares equal pixel counts.
    // Raise to 1.5 for retina sharpness once measuring is done — the atlas follows DPR.
    const MAX_DPR = 1;
    const DPR = Math.min(window.devicePixelRatio || 1, MAX_DPR);
    let pressure, divergence;
    let renderFont = '';
    let halfCell = 0;

    // Glyph atlas: every (char, hue-bucket) pair rasterised once, so the render loop is
    // drawImage-only — no per-cell colour string, no per-cell CSS parse, no text shaping.
    const HUE_STEPS = 16;
    // Tiles are padded past the cell so a tall glyph (@ # %) overflows into its own tile
    // instead of bleeding into the neighbour and blitting as a stray fragment.
    const TILE_PAD = 1.4;
    const atlas = document.createElement('canvas');
    const atlasCtx = atlas.getContext('2d');
    let tileCss = 0, tilePx = 0, tileOff = 0;

    // Live Configurable Parameters
    const PARAMS = {
      cellSize: 14,
      iterations: 4,
      dt: 0.15,
      viscosity: 0.00001,
      diffusion: 0.00001,
      dissipation: 0.997,     // Density fade
      velocityDamping: 0.96, // Velocity fade (localization)
      mouseRadius: 10,
      mouseDensity: 0.25,
      mouseForce: 0.005,     // Negative for backward impulse
      clickRadius: 66,
      clickForce: 1.6,
      clickDensity: 3.1,
      baseHue: 210,
      hueShift: 40,
    };

    const RAMPS = [' ', '_', '<', 'o'];

    let cols = 0, rows = 0, N = 0;
    let u, v, u_prev, v_prev;
    let density, density_prev;
    let pendingPointer = null;
    let hasPointerMoved = false;

    const perf = {
      fps: 0,
      frameMs: 0,
      stepMs: 0,
      renderMs: 0,
      activeCells: 0,
      drawnCells: 0,
      densitySum: 0,
      maxFrameMs: 0,
      samples: [],
      rafSamples: [],
      lastFpsUpdate: performance.now(),
      lastRaf: 0,
      fpsFrames: 0,
      benchmarkRunning: false,
      benchmarkStart: 0,
      benchmarkDuration: 8000,
      benchmarkSeeded: false,
      benchmarkResult: null,
      autoBurstEveryMs: 30,
      lastAutoBurst: 0,
    };

    function IX(x, y) {
      x = Math.max(0, Math.min(cols - 1, x));
      y = Math.max(0, Math.min(rows - 1, y));
      return x + y * cols;
    }

    function initGrid() {
      const width = window.innerWidth;
      const height = window.innerHeight;
      canvas.width = Math.floor(width * DPR);
      canvas.height = Math.floor(height * DPR);
      canvas.style.width = `${width}px`;
      canvas.style.height = `${height}px`;
      ctx.setTransform(DPR, 0, 0, DPR, 0, 0);

      cols = Math.max(2, Math.floor(width / PARAMS.cellSize));
      rows = Math.max(2, Math.floor(height / PARAMS.cellSize));
      N = cols * rows;

      u = new Float32Array(N);
      v = new Float32Array(N);
      u_prev = new Float32Array(N);
      v_prev = new Float32Array(N);
      density = new Float32Array(N);
      density_prev = new Float32Array(N);
      pressure = new Float32Array(N);
      divergence = new Float32Array(N);

      renderFont = `${Math.floor(PARAMS.cellSize * 0.85)}px monospace`;
      halfCell = PARAMS.cellSize * 0.5;
      buildAtlas();
    }

    function buildAtlas() {
      tileCss = PARAMS.cellSize * TILE_PAD;
      tilePx = tileCss * DPR;
      tileOff = (tileCss - PARAMS.cellSize) * 0.5;
      // Assigning width/height clears the canvas and resets state, so transform comes after.
      atlas.width = Math.ceil(RAMPS.length * tilePx);
      atlas.height = Math.ceil(HUE_STEPS * tilePx);
      atlasCtx.setTransform(DPR, 0, 0, DPR, 0, 0);
      atlasCtx.font = renderFont;
      atlasCtx.textAlign = 'center';
      atlasCtx.textBaseline = 'middle';
      const half = tileCss * 0.5;
      for (let k = 0; k < HUE_STEPS; k++) {
        const hue = PARAMS.baseHue + (k / (HUE_STEPS - 1)) * PARAMS.hueShift;
        atlasCtx.fillStyle = `hsla(${hue}, 85%, 65%, 0.85)`;
        for (let c = 0; c < RAMPS.length; c++) {
          atlasCtx.fillText(RAMPS[c], c * tileCss + half, k * tileCss + half);
        }
      }
    }

    // Interior loops never leave the grid, so IX()'s clamp was dead work on every access.
    // Neighbours are idx±1 (same row) and idx±cols (row above/below). bench-step.mjs asserts
    // this produces a bit-identical field to the clamped version.
    function setBnd(b, x) {
      const top = 0, top1 = cols, bot = (rows - 1) * cols, bot1 = (rows - 2) * cols;
      for (let i = 1; i < cols - 1; i++) {
        x[top + i] = b === 2 ? -x[top1 + i] : x[top1 + i];
        x[bot + i] = b === 2 ? -x[bot1 + i] : x[bot1 + i];
      }
      for (let j = 1, r = cols; j < rows - 1; j++, r += cols) {
        x[r] = b === 1 ? -x[r + 1] : x[r + 1];
        x[r + cols - 1] = b === 1 ? -x[r + cols - 2] : x[r + cols - 2];
      }
    }

    function linSolve(b, x, x0, a, c) {
      const cRecip = 1.0 / c;
      for (let k = 0; k < PARAMS.iterations; k++) {
        for (let j = 1; j < rows - 1; j++) {
          const r = j * cols;
          for (let idx = r + 1, end = r + cols - 1; idx < end; idx++) {
            x[idx] = (x0[idx] + a * (x[idx + 1] + x[idx - 1] + x[idx + cols] + x[idx - cols])) * cRecip;
          }
        }
        setBnd(b, x);
      }
    }

    function diffuse(b, x, x0, diff, dt) {
      const a = dt * diff * (cols - 2) * (rows - 2);
      linSolve(b, x, x0, a, 1 + 4 * a);
    }

    function advect(b, d, d0, u, v, dt) {
      const dt0 = dt * (cols - 2);
      const xMax = cols - 1.5, yMax = rows - 1.5;
      for (let j = 1; j < rows - 1; j++) {
        const r = j * cols;
        for (let i = 1; i < cols - 1; i++) {
          const idx = r + i;
          let x = i - dt0 * u[idx];
          let y = j - dt0 * v[idx];
          if (x < 0.5) x = 0.5; else if (x > xMax) x = xMax;
          if (y < 0.5) y = 0.5; else if (y > yMax) y = yMax;
          const i0 = x | 0, j0 = y | 0;
          const s1 = x - i0, s0 = 1.0 - s1;
          const t1 = y - j0, t0 = 1.0 - t1;
          const a0 = j0 * cols + i0, a1 = a0 + cols;
          d[idx] = s0 * (t0 * d0[a0] + t1 * d0[a1]) + s1 * (t0 * d0[a0 + 1] + t1 * d0[a1 + 1]);
        }
      }
      setBnd(b, d);
    }

    function project(u, v, p, div) {
      const inv = -0.5 / Math.max(cols, rows);
      for (let j = 1; j < rows - 1; j++) {
        const r = j * cols;
        for (let idx = r + 1, end = r + cols - 1; idx < end; idx++) {
          div[idx] = inv * (u[idx + 1] - u[idx - 1] + v[idx + cols] - v[idx - cols]);
          p[idx] = 0;
        }
      }
      setBnd(0, div);
      setBnd(0, p);
      linSolve(0, p, div, 1, 4);

      for (let j = 1; j < rows - 1; j++) {
        const r = j * cols;
        for (let idx = r + 1, end = r + cols - 1; idx < end; idx++) {
          u[idx] -= 0.5 * (p[idx + 1] - p[idx - 1]) * cols;
          v[idx] -= 0.5 * (p[idx + cols] - p[idx - cols]) * rows;
        }
      }
      setBnd(1, u);
      setBnd(2, v);
    }

    function processPointerInput() {
      if (!pendingPointer) return;
      const { x, y, dx, dy } = pendingPointer;
      injectFluid(
        x,
        y,
        PARAMS.mouseRadius,
        PARAMS.mouseDensity,
        dx * PARAMS.mouseForce,
        dy * PARAMS.mouseForce
      );
      pendingPointer = null;
    }

    function step() {
      processPointerInput();
      diffuse(1, u_prev, u, PARAMS.viscosity, PARAMS.dt);
      diffuse(2, v_prev, v, PARAMS.viscosity, PARAMS.dt);
      project(u_prev, v_prev, pressure, divergence);
      advect(1, u, u_prev, u_prev, v_prev, PARAMS.dt);
      advect(2, v, v_prev, u_prev, v_prev, PARAMS.dt);
      project(u, v, pressure, divergence);

      diffuse(0, density_prev, density, PARAMS.diffusion, PARAMS.dt);
      advect(0, density, density_prev, u, v, PARAMS.dt);

      for (let i = 0; i < N; i++) {
        density[i] *= PARAMS.dissipation;
        u[i] *= PARAMS.velocityDamping;
        v[i] *= PARAMS.velocityDamping;
      }
    }

    function injectFluid(cx, cy, radius, amount, forceX = 0, forceY = 0) {
      const gx = Math.floor(cx / PARAMS.cellSize);
      const gy = Math.floor(cy / PARAMS.cellSize);
      const r = Math.ceil(radius / PARAMS.cellSize);

      for (let y = -r; y <= r; y++) {
        for (let x = -r; x <= r; x++) {
          if (x * x + y * y <= r * r) {
            const idx = IX(gx + x, gy + y);
            density[idx] = Math.min(density[idx] + amount, 5.0);
            u[idx] += forceX;
            v[idx] += forceY;
          }
        }
      }
    }

    function render() {
      ctx.fillStyle = '#07080b';
      ctx.fillRect(0, 0, window.innerWidth, window.innerHeight);

      const cellSize = PARAMS.cellSize;
      const lastRamp = RAMPS.length - 1;
      const lastHue = HUE_STEPS - 1;
      const src = tilePx;
      let activeCells = 0;
      let drawnCells = 0;

      for (let j = 0; j < rows; j++) {
        const py = j * cellSize - tileOff;
        for (let i = 0, idx = j * cols; i < cols; i++, idx++) {
          const d = density[idx];
          if (d <= 0.005) continue;

          activeCells += 1;
          const ux = u[idx], vy = v[idx];
          const val = Math.min(1, d + Math.sqrt(ux * ux + vy * vy) * 0.1);

          // RAMPS[0] is ' ': below one ramp step the glyph is blank, so the blit would
          // cost a full draw call and paint nothing. d > 0.005 asks "is there density
          // here"; the question that matters is "does this produce a visible glyph".
          const charIdx = (val * lastRamp) | 0;
          if (charIdx === 0) continue;
          drawnCells += 1;

          ctx.drawImage(
            atlas,
            charIdx * src, ((val * lastHue) | 0) * src, src, src,
            i * cellSize - tileOff, py, tileCss, tileCss
          );
        }
      }

      perf.activeCells = activeCells;
      perf.drawnCells = drawnCells;
    }

    function percentile(sortedValues, p) {
      if (!sortedValues.length) return 0;
      const idx = Math.min(sortedValues.length - 1, Math.floor((sortedValues.length - 1) * p));
      return sortedValues[idx];
    }

    function updateHud() {
      // HUD-only telemetry: a full-grid scan every 500ms, not once per frame.
      let densitySum = 0;
      for (let i = 0; i < N; i++) densitySum += density[i];
      perf.densitySum = densitySum;

      const result = perf.benchmarkResult;
      const benchmarkLine = result
        ? `Benchmark 8s heavy: avg ${result.avgFrame.toFixed(2)}ms | p95 ${result.p95Frame.toFixed(2)}ms | p99 ${result.p99Fps.toFixed(1)} FPS`
        : (perf.benchmarkRunning ? 'Benchmark: running heavy automated stress pattern…' : 'Benchmark: idle');

      perfHud.textContent =
        `FPS: ${perf.fps.toFixed(1)}\n` +
        `Frame: ${perf.frameMs.toFixed(2)} ms\n` +
        `Step: ${perf.stepMs.toFixed(2)} ms\n` +
        `Render: ${perf.renderMs.toFixed(2)} ms\n` +
        `Max frame: ${perf.maxFrameMs.toFixed(2)} ms\n` +
        `Active cells: ${perf.activeCells} / ${N} (${perf.drawnCells} drawn)\n` +
        `Density sum: ${perf.densitySum.toFixed(1)}\n` +
        benchmarkLine + `\n` +
        `Press B to run benchmark, H to hide HUD.`;
    }

    function beginBenchmark() {
      perf.samples = [];
      perf.rafSamples = [];
      perf.maxFrameMs = 0;
      perf.benchmarkResult = null;
      perf.benchmarkRunning = true;
      perf.benchmarkStart = performance.now();
      perf.lastAutoBurst = 0;
      perf.lastRaf = 0;
      perf.benchmarkSeeded = false;
    }

    const WARMUP_FRAMES = 10;

    function finishBenchmark() {
      perf.benchmarkRunning = false;
      // Drop warmup frames: JIT, first GC and the seed-burst frame are a one-off startup
      // stall, not renderer cost, and Math.max let a single one of them set the floor.
      const frames = perf.samples.slice(WARMUP_FRAMES).sort((a, b) => a - b);
      const raf = perf.rafSamples.slice(WARMUP_FRAMES).sort((a, b) => a - b);
      const avgFrame = frames.length ? frames.reduce((a, b) => a + b, 0) / frames.length : 0;
      const avgRaf = raf.length ? raf.reduce((a, b) => a + b, 0) / raf.length : 0;
      const p95Frame = percentile(frames, 0.95);
      const p99Frame = percentile(frames, 0.99);
      const p99Fps = raf.length ? 1000 / percentile(raf, 0.99) : 0;
      const avgFps = avgRaf ? 1000 / avgRaf : 0;
      perf.benchmarkResult = { avgFrame, p95Frame, p99Frame, p99Fps, avgFps, frames: frames.length };
      console.table({ benchmark_ms_8000_heavy: { avgFrame, p95Frame, p99Frame, avgFps, p99Fps, frames: frames.length } });
    }

    function automatedBurst(now) {
      if (!perf.benchmarkRunning) return;
      if (!perf.benchmarkSeeded) {
        const points = [
          [window.innerWidth * 0.18, window.innerHeight * 0.28],
          [window.innerWidth * 0.5, window.innerHeight * 0.22],
          [window.innerWidth * 0.82, window.innerHeight * 0.28],
          [window.innerWidth * 0.26, window.innerHeight * 0.7],
          [window.innerWidth * 0.74, window.innerHeight * 0.72],
        ];
        for (const [x, y] of points) {
          injectFluid(x, y, PARAMS.clickRadius * 2.1, PARAMS.clickDensity * 2.2, 0.32, -0.28);
        }
        perf.benchmarkSeeded = true;
      }
      if (!perf.lastAutoBurst || now - perf.lastAutoBurst >= perf.autoBurstEveryMs) {
        const t = (now - perf.benchmarkStart) * 0.0042;
        const cx = window.innerWidth * 0.5;
        const cy = window.innerHeight * 0.5;
        const orbitA = [0, Math.PI * 0.5, Math.PI, Math.PI * 1.5];
        for (const phase of orbitA) {
          const x = cx + Math.cos(t + phase) * window.innerWidth * 0.32;
          const y = cy + Math.sin(t * 1.37 + phase) * window.innerHeight * 0.24;
          const dx = Math.cos(t * 2.6 + phase) * 34;
          const dy = Math.sin(t * 2.1 + phase) * 34;
          injectFluid(x, y, PARAMS.mouseRadius * 1.85, PARAMS.mouseDensity * 1.75, dx * PARAMS.mouseForce, dy * PARAMS.mouseForce);
        }
        perf.lastAutoBurst = now;
      }
      if (now - perf.benchmarkStart >= perf.benchmarkDuration) {
        finishBenchmark();
      }
    }

    function animate(now = performance.now()) {
      const frameStart = performance.now();
      automatedBurst(now);

      const stepStart = performance.now();
      step();
      const stepEnd = performance.now();

      const renderStart = performance.now();
      render();
      const renderEnd = performance.now();

      perf.stepMs = stepEnd - stepStart;
      perf.renderMs = renderEnd - renderStart;
      perf.frameMs = renderEnd - frameStart;
      perf.maxFrameMs = Math.max(perf.maxFrameMs, perf.frameMs);
      perf.fpsFrames += 1;

      const elapsed = renderEnd - perf.lastFpsUpdate;
      // rafSamples = real wall-clock frame interval (vsync + compositing included).
      // perf.samples = JS work only. Before this fix both held the same number.
      if (perf.benchmarkRunning && perf.lastRaf) perf.rafSamples.push(now - perf.lastRaf);
      perf.lastRaf = now;
      if (elapsed >= 500) {
        perf.fps = (perf.fpsFrames * 1000) / elapsed;
        perf.fpsFrames = 0;
        perf.lastFpsUpdate = renderEnd;
        updateHud();
      }

      if (perf.benchmarkRunning) {
        perf.samples.push(perf.frameMs);
      }

      requestAnimationFrame(animate);
    }

    // Interactive Listeners
    let lastX = 0, lastY = 0;
    let resizeRaf = 0;

    window.addEventListener('pointermove', (e) => {
      const dx = hasPointerMoved ? e.clientX - lastX : 0;
      const dy = hasPointerMoved ? e.clientY - lastY : 0;
      pendingPointer = { x: e.clientX, y: e.clientY, dx, dy };
      lastX = e.clientX;
      lastY = e.clientY;
      hasPointerMoved = true;
    }, { passive: true });

    window.addEventListener('pointerdown', (e) => {
      const radius = PARAMS.clickRadius;
      const gx = Math.floor(e.clientX / PARAMS.cellSize);
      const gy = Math.floor(e.clientY / PARAMS.cellSize);
      const r = Math.ceil(radius / PARAMS.cellSize);

      for (let y = -r; y <= r; y++) {
        for (let x = -r; x <= r; x++) {
          const distSq = x * x + y * y;
          if (distSq <= r * r && distSq > 0) {
            const idx = IX(gx + x, gy + y);
            const dist = Math.sqrt(distSq);
            const force = (1 - dist / r) * PARAMS.clickForce;
            u[idx] += (x / dist) * force;
            v[idx] += (y / dist) * force;
            density[idx] = Math.min(density[idx] + PARAMS.clickDensity, 5.0);
          }
        }
      }
    });

    window.addEventListener('resize', () => {
      cancelAnimationFrame(resizeRaf);
      resizeRaf = requestAnimationFrame(initGrid);
    }, { passive: true });

    window.addEventListener('keydown', (e) => {
      if (e.key === 'b' || e.key === 'B') beginBenchmark();
      if (e.key === 'h' || e.key === 'H') {
        perfHud.style.display = perfHud.style.display === 'none' ? 'block' : 'none';
      }
    });

    // Setup Tweakpane Controls
    async function setupGui() {
      const { Pane } = await import('https://cdn.jsdelivr.net/npm/tweakpane@4.0.5/dist/tweakpane.min.js');
      const pane = new Pane({ title: 'Simulation Controls' });

      const fGrid = pane.addFolder({ title: 'Grid & Visuals' });
      fGrid.addBinding(PARAMS, 'cellSize', { min: 8, max: 32, step: 1 }).on('change', () => initGrid());
      fGrid.addBinding(PARAMS, 'dt', { min: 0.05, max: 0.3, step: 0.01, label: 'Time Step' });
      fGrid.addBinding(PARAMS, 'baseHue', { min: 0, max: 360, step: 1 }).on('change', buildAtlas);
      fGrid.addBinding(PARAMS, 'hueShift', { min: 0, max: 180, step: 1 }).on('change', buildAtlas);

      const fFluid = pane.addFolder({ title: 'Fluid Dynamics' });
      fFluid.addBinding(PARAMS, 'dissipation', { min: 0.90, max: 0.999, step: 0.001, label: 'Density Fade' });
      fFluid.addBinding(PARAMS, 'velocityDamping', { min: 0.50, max: 0.99, step: 0.01, label: 'Velocity Fade' });
      fFluid.addBinding(PARAMS, 'viscosity', { min: 0, max: 0.0005, step: 0.00001 });
      fFluid.addBinding(PARAMS, 'diffusion', { min: 0, max: 0.001, step: 0.00005 });
      fFluid.addBinding(PARAMS, 'iterations', { min: 1, max: 10, step: 1 });

      const fMouse = pane.addFolder({ title: 'Mouse Trail' });
      fMouse.addBinding(PARAMS, 'mouseRadius', { min: 2, max: 40, step: 1 });
      fMouse.addBinding(PARAMS, 'mouseDensity', { min: 0.05, max: 2.0, step: 0.05 });
      fMouse.addBinding(PARAMS, 'mouseForce', { min: -0.02, max: 0.02, step: 0.0005, label: 'Impulse Force' });

      const fClick = pane.addFolder({ title: 'Click Burst' });
      fClick.addBinding(PARAMS, 'clickRadius', { min: 8, max: 80, step: 2 });
      fClick.addBinding(PARAMS, 'clickForce', { min: 0.05, max: 2.0, step: 0.05 });
      fClick.addBinding(PARAMS, 'clickDensity', { min: 0.2, max: 5.0, step: 0.1 });
    }

    // Bootstrap
    initGrid();
    // Tweakpane is ~150KB of CDN for dev-only sliders. Open with #tune to load it.
    if (location.hash === '#tune') setupGui();
    updateHud();
    requestAnimationFrame((t) => { perf.lastFpsUpdate = t; animate(t); });
  </script>
</body>
</html>
